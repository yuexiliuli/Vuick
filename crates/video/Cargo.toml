[package]
name = "video"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 视频查看器 crate（FFmpeg 经 libloading 运行时加载 + 帧钟播放 + 音频输出）"

[dependencies]
base = { path = "../base" }
gpui = { workspace = true }
kimg = { workspace = true }
anyhow = { workspace = true }
config = { path = "../config" }
# 共享媒体 IO（FFmpeg FFI 桥 + CPAL 音频 sink）：本 crate 已迁至 media_io，不再直接依赖
# cpal / libloading（media_io transitively 提供）。
media_io = { path = "../media_io" }
# video 图标变体（IconName::Play/Pause/Volume/…）由本 crate 的 ui 依赖开启其 `video` feature。
ui = { path = "../ui", features = ["video"] }
viewer = { path = "../viewer" }
# 双设备 GPU 直通（零回读）：worker 自有 D3D11 设备 + 共享 NV12 纹理（shared handle +
# keyed mutex）跨设备移动。features 取与 media_ffmpeg 同款最小集（Direct3D11 生成的类型内部
# 引用 Direct3D/Dxgi，三者必须同开才能编译）。
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
