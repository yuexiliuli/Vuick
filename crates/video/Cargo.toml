[package]
name = "video"
version = "0.1.0"
edition = "2024"
description = "gpui-editor 视频查看器 crate（FFmpeg 经 libloading 运行时加载 + 帧钟播放 + 音频输出）"

[dependencies]
gpui = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
cpal = { workspace = true }
libloading = { workspace = true }
config = { path = "../config" }
# video 图标变体（IconName::Play/Pause/Volume/…）由本 crate 的 ui 依赖开启其 `video` feature。
ui = { path = "../ui", features = ["video"] }
viewer = { path = "../viewer" }

[features]
# 语义与拆 crate 前一致：根包 `video` feature 经 `dep:video` 开启本 crate；
# 本 feature 仅为 `cargo check -p video --features video` 的便捷开关，无 cfg 消费。
video = []

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
