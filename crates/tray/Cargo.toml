[package]
name = "tray"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 系统托盘 crate（Windows 托盘图标 / 关闭到托盘 / 托盘菜单：unsafe Win32 全部收敛于此）"

[dependencies]
# 复用 workspace 已有 windows（含 Win32_UI_Shell / Win32_UI_WindowsAndMessaging /
# Win32_System_LibraryLoader，无需改 workspace features）；非 windows 目标编译为空操作。
windows = { workspace = true }
# 程序图标 ICO 解码（PNG 条目 → RGBA → BGRA → CreateIconIndirect 构造 HICON）：
# CreateIconFromResourceEx 实测对这批图标（条目 wPlanes=0）返回空句柄，改用
# kimg 解码 + 手建 DIB 的已验证路线（手绘版托盘即此路，真机可用）。
kimg = { workspace = true }
