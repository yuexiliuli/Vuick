[package]
name = "tray"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "vuick 系统托盘 crate（Windows 托盘图标 / 关闭到托盘 / 托盘菜单：unsafe Win32 全部收敛于此）"

[dependencies]
# 程序图标 ICO 解码（PNG 条目 → RGBA → BGRA → CreateIconIndirect 构造 HICON）：
# CreateIconFromResourceEx 实测对这批图标（条目 wPlanes=0）返回空句柄，改用
# kimg 解码 + 手建 DIB 的已验证路线（手绘版托盘即此路，真机可用）。
kimg = { workspace = true }

# Windows 专用：系统托盘/剪贴板 Win32 调用（unsafe Win32 全收敛于本 crate，见 description）。
# target 门控（Phase 1 Linux 编译解锁）：非 Windows 目标不再编译 windows/windows-future；
# 复用 workspace 已有 windows（含 Win32_UI_Shell / Win32_UI_WindowsAndMessaging /
# Win32_System_LibraryLoader，无需改 workspace features）；代码内 windows 使用点已
# cfg(windows) 门控（mod imp / build_dropfiles_bytes），非 windows 目标编译为空操作。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
