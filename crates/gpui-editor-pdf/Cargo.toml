[package]
name = "gpui-editor-pdf"
version = "0.1.0"
edition = "2024"
description = "gpui-editor PDF 阅读器 crate（pdfium 栅格化 + 瓦片虚拟化）"
build = "build.rs"

[dependencies]
gpui = { workspace = true }
pdfium-render = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
gpui-editor-config = { path = "../gpui-editor-config" }
gpui-editor-base = { path = "../gpui-editor-base" }
gpui-editor-ui = { path = "../gpui-editor-ui" }
gpui-editor-viewer = { path = "../gpui-editor-viewer" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
