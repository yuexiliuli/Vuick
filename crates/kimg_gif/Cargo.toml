[package]
name = "kimg_gif"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "kimg 拆分的 GIF 解/编 crate（codecs/gif：容器+LZW+画布+编码器，移植 SimdCodecs）。"

[dependencies]
kimg_core = { path = "../kimg_core" }

[dev-dependencies]
# GIF oracle 对照（tests/gif_oracle.rs）：对语料/夹具双解逐帧 RGBA8 逐字节对比 + 自研 encoder →
# gif crate decoder 反向回环。运行时零 gif 依赖。
gif = "0.14.2"
