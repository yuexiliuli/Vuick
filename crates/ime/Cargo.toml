[package]
name = "ime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "vuick 共享 IME 状态机核心 crate（byte 语义，ImeTextHost / replace / unmark 等）"

[dependencies]
gpui = { workspace = true }
base = { path = "../base" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
