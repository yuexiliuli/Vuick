[package]
name = "kimg"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "纯 Rust 图像解码/编码兼容层（镜像 image 0.25 的仓库实际使用子集）。第 3 阶段替换 image 的核心 crate。"

[dependencies]
# 图像后端（全部纯 Rust）。版本对齐 Cargo.lock 既有锁定（png/gif/image-webp/tiff）。
# JPEG 用 zune-jpeg（== image 0.25.10 自身所用后端，保证字节级一致）——任务原始方案中的
# jpeg-decoder 0.3 与 image 的参考输出存在 IDCT ±1 差异，无法达成 parity=0，故按实测替换。
png = "0.17.16"
gif = "0.14.2"
image-webp = "0.2.4"
tiff = "0.11.3"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# 自研 PNG 解码热路径（移植 SimdCodecs）：IDAT zlib 解压用 fdeflate（lock 0.3.7，纯 Rust，
# 也是 png crate 0.17 自身的解码后端——与其逐字节同算法的同时避免 miniz_oxide 的 ~3× 解压慢）。
# 块 CRC 校验用 crc32fast（lock 1.5.0）。两者 workspace 已锁定，不引入新版本。
fdeflate = "0.3"
crc32fast = "1.4"

[dev-dependencies]
# 仅测试用：生成 fixture 时仍走 png crate 编码；手写 filter 行的 PNG 构造器需要 zlib 压缩。
flate2 = "1.1"

[package.metadata.docs.rs]
all-features = true
