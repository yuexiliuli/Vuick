[package]
name = "kimg"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "纯 Rust 图像解码/编码兼容层（镜像 image 0.25 的仓库实际使用子集）。第 3 阶段替换 image 的核心 crate。"

[dependencies]
# 图像后端（全部纯 Rust）。版本对齐 Cargo.lock 既有锁定（gif/image-webp/tiff）。
# PNG 已自研解/编（pngsimd + png_encoder，见 codecs/png_encoder.rs），运行时不再依赖 png crate
# （png 0.17.16 移入 dev-dependencies 仅作测试/基准对照，见下方说明）。
# JPEG 用 zune-jpeg（== image 0.25.10 自身所用后端，保证字节级一致）——任务原始方案中的
# jpeg-decoder 0.3 与 image 的参考输出存在 IDCT ±1 差异，无法达成 parity=0，故按实测替换。
gif = "0.14.2"
image-webp = "0.2.4"
tiff = "0.11.3"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# 自研 PNG 解码热路径（移植 SimdCodecs）：IDAT zlib 解压用 fdeflate（lock 0.3.7，纯 Rust，
# 也是 png crate 0.17 自身的解码后端）。选型依据（2026-10-31 实测，release -z）：zlib-rs 0.6.8 /
# zune-inflate 0.2.54 在同批真图 IDAT 的亚 10% 聚合优势主要来自高压缩语料；本仓基准的合成单图
# fdeflate 独占优势——随机内容 8.3MB RGBA 流 fdeflate 分块喂入 ~3.1-4.1ms vs zlib-rs
# `decompress_slice` ~9.9ms；photo 平滑内容 8.3MB 流 fdeflate 19.5ms vs zlib-rs 25.8ms。
# 两种内容下 zlib-rs 都不更快（一次性能 API 还会触发 IDAT 拼接拷贝），故按计划保持 fdeflate。
# 块 CRC 校验用 crc32fast（lock 1.5.0）。
fdeflate = "0.3"
crc32fast = "1.4"

[features]
default = []
# 分阶段计时探针（仅诊断 bench）：pngsimd 解码热路径逐阶段累计耗时，环境变量
# KIMG_PNG_STAGE_PROFILE=1 时随每次解码打印 `STAGE ...` 行；KIMG_PNG_NO_SIMD=1 时强制
# 反滤波/展开走标量（量化 SIMD 收益）。不开本 feature 即零代码影响（正常构建路径不变）。
stage_profile = []

[dev-dependencies]
# 仅测试用：生成 fixture 时仍走 png crate 编码；手写 filter 行的 PNG 构造器需要 zlib 压缩。
flate2 = "1.1"
# PNG cross-oracle 对照与 fixture 生成：PngEncoder 已自研（codecs/png_encoder.rs，运行时零 png 依赖），
# png 0.17.16 仅测试/基准用——解码读回逐字节对照（tests/encode_self.rs 的 cross oracle）、
# png_port_parity / png_port_bench / idat_backend_bench 的参照端。imgbench 属基准对照 crate，保留 png。
png = "0.17.16"
# WebP oracle harness（tests/webp_oracle.rs）：对 fixture 算 dwebp golden 同款 sha256(RGBA)
# 逐 fixture 对比；与 SimdCodecs WebpOracleTests.cs 的哈希口径一致。
sha2 = "0.10"
# inflate 后端的一次性对比微基准（idat_backend_bench `#[ignore]`）需要拿 zlib-rs / zune-inflate
# 与 fdeflate 对照以复跑选型结论——仅 dev，不进入运行时依赖面（结论见上方 fdeflate 注释）。
zlib-rs = "0.6.8"
zune-inflate = "0.2.54"

[package.metadata.docs.rs]
all-features = true
