[package]
name = "kimg"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "纯 Rust 图像解码/编码兼容层（镜像 image 0.25 的仓库实际使用子集）。第 3 阶段替换 image 的核心 crate。kimg 拆分为门面 crate：共享类型来自 kimg_core，各格式编解码器来自 kimg_png/kimg_gif/kimg_webp/kimg_jpeg/kimg_tiff/kimg_bmp/kimg_ico/kimg_pnm。"

[dependencies]
# kimg 拆分（2026-11）：共享核心 + 8 个格式 crate。本 crate 只做聚合分发（GenericDecoder /
# DynamicImage / ImageReader / 门面自由函数）与对旧 `kimg::` 公共路径的全量重导出，消费方零改动。
kimg_core = { path = "../kimg_core" }
kimg_png = { path = "../kimg_png" }
kimg_gif = { path = "../kimg_gif" }
kimg_webp = { path = "../kimg_webp" }
kimg_jpeg = { path = "../kimg_jpeg" }
kimg_tiff = { path = "../kimg_tiff" }
kimg_bmp = { path = "../kimg_bmp" }
kimg_ico = { path = "../kimg_ico" }
kimg_pnm = { path = "../kimg_pnm" }
kimg_heif = { path = "../kimg_heif" }

[features]
default = []
# 分阶段计时探针（仅诊断 bench）：转发到各格式 crate 的 stage_profile 探针 feature
# （pngsimd / WebP 解码热路径分阶段耗时），供 imgbench 的 stage-profile feature 使用。
stage_profile = ["kimg_png/stage_profile", "kimg_webp/stage_profile"]

[dev-dependencies]
# 门面冒烟测试（tests/basic.rs, tests/surface.rs）只用 kimg 自身能力，无需外部 oracle 依赖；
# 各格式的 oracle 对照依赖（png/gif/image-webp/sha2/flate2/zlib-rs/zune-inflate）已随测试迁往对应格式 crate。
