[package]
name = "markdown"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 自研 Markdown 渲染 + 文档管线 crate（Doc+shard 管线；WYSIWYG 编辑已迁至 markdown_wysiwyg）"

[dependencies]
# 渲染/宿主：gpui 钉 zed 提交（workspace 统一版本）。
gpui = { workspace = true }
# 大文档「分块读盘·渐进装配」/ 解析报错上下文。
anyhow = { workspace = true }
# LaTeX 数学排版：parse → layout → render（embed-fonts 内嵌 KaTeX 字体）。
ratex-parser = { workspace = true }
ratex-layout = { workspace = true }
ratex-render = { workspace = true }
regex = { workspace = true }
# 文本存储 / WYSIWYG 缓冲区（与 editor 同版本 ropey，`crate::markdown` 自持一份）。
ropey = { workspace = true }
# 快速非加密哈希：fold_plan/shape 缓存容器重建。
rustc-hash = { workspace = true }
serde_json = { workspace = true }
# 拆 workspace 后迁出的叶/核心 crate：{config, base, ui}。ime/editor/syntax 在本 crate
# src 全树无任何符号引用（仅注释提及），已作死依赖清理；WYSIWYG 与 CodeEditor 编辑由
# markdown_wysiwyg crate 自持其编辑/IME/语法依赖（2026-11）。
config = { path = "../config" }
base = { path = "../base" }
ui = { path = "../ui" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
