[package]
name = "markdown_wysiwyg_mermaid"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "vuick WYSIWYG 的 Mermaid 图渲染子系统：flowchart/sequence 解析、布局、绘制（自 markdown_wysiwyg 的 wysiwyg/mermaid 拆出的独立 crate）"

[dependencies]
# 渲染/宿主：gpui 钉 zed 提交（workspace 统一版本）。
gpui = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
