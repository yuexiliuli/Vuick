[package]
name = "gpui-editor-shell"
version = "0.1.0"
edition = "2024"
description = "gpui-editor 应用外壳 crate（EditorApp 主视图 + 自绘滚动条 + 本地键位组合）"

[dependencies]
gpui = { workspace = true }
# app 直接使用的外部依赖（只重分配、不加新）：系统文件对话框 / 大文档分块读盘异步通道 /
# 检索扫描的内存序搜索 / 文本存储类型。
rfd = { workspace = true }
futures = { workspace = true }
memchr = { workspace = true }
ropey = { workspace = true }
# 迁入本 crate 后 app/scrollbar 内部经 crate-root 短别名消费的全部项目内 crate。
gpui-editor-config = { path = "../gpui-editor-config" }
gpui-editor-base = { path = "../gpui-editor-base" }
gpui-editor-syntax = { path = "../gpui-editor-syntax" }
gpui-editor-ui = { path = "../gpui-editor-ui" }
gpui-editor-editor = { path = "../gpui-editor-editor" }
gpui-editor-markdown = { path = "../gpui-editor-markdown" }
gpui-editor-toc = { path = "../gpui-editor-toc" }
gpui-editor-pdf = { path = "../gpui-editor-pdf" }
gpui-editor-image = { path = "../gpui-editor-image" }
# 视频查看器随本 crate 的 `video` feature 开关（`cfg(feature = "video")`）。
gpui-editor-video = { path = "../gpui-editor-video", optional = true }
gpui-editor-epub = { path = "../gpui-editor-epub" }

[features]
default = ["video"]
# video：与根包同名 feature 一致，开启 video crate 依赖并转发给 ui crate
# （IconName::Play/Pause/… 视频图标变体，见 gpui-editor-ui/icon.rs）。
video = ["dep:gpui-editor-video", "gpui-editor-ui/video"]

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
