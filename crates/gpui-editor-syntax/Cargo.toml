[package]
name = "gpui-editor-syntax"
version = "0.1.0"
edition = "2024"
description = "gpui-editor 代码块语法高亮 crate（syntect 默认语法集 + GitHub 明/暗配色）"

[dependencies]
gpui = { workspace = true }
syntect = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
