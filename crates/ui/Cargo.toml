[package]
name = "ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "vuick 自研 UI 组件库 crate（button/theme/input/root/scrollbar 等，替代 gpui-component）"

[dependencies]
gpui = { workspace = true }
regex = { workspace = true }
config = { path = "../config" }
base = { path = "../base" }
ime = { path = "../ime" }
# 应用图标（变色龙 128×128 ICO，PNG 编码）解码：kimg 默认特性已含 ico 容器。
kimg = { workspace = true }

[features]
# video 相关图标变体（IconName::Play/Pause/Volume/…）的开关；本 feature 无实际内容，纯 cfg 门。
# 开启路径：根 `vuick` 的 `video = ["ui/video"]`（唯一显式转发点），
# 及 video crate 的 `ui{features=["video"]}` 随 `dep:video` 一并启用。
video = []

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
