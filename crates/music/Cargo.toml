[package]
name = "music"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 音乐播放器核心引擎 crate（FFmpeg 音频经 libloading 运行时加载 + cpal 输出 + 播放引擎；UI 在后续阶段添加）"

[dependencies]
base = { path = "../base" }
gpui = { workspace = true }
anyhow = { workspace = true }
kimg = { workspace = true }
config = { path = "../config" }
ui = { path = "../ui" }
# 共享媒体 IO（FFmpeg FFI 桥 + CPAL 音频 sink）：本 crate 已全量迁至 media_io，不再直接
# 依赖 libloading 与 cpal（media_io transitively 提供；cpal 仅在测试里直接引用 → dev 依赖）。
media_io = { path = "../media_io" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
# 测试（player.rs integration）直接用 cpal 查默认输出设备（SKIP 判定），须显式 dev 依赖。
cpal = { workspace = true }
# K8 根因（同 shell）：config 作依赖在 music 测试二进制中自身 cfg(test) 不生效 → 直读真实
# %APPDATA% 配置/会话；dev 下打开 test-mode 使其落隔离临时目录（仅测试构建启用，生产路径不变）。
config = { path = "../config", features = ["test-mode"] }
