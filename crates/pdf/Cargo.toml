[package]
name = "pdf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor PDF 阅读器 crate（pdfium 栅格化 + 瓦片虚拟化）"
build = "build.rs"

[dependencies]
gpui = { workspace = true }
pdfium-render = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
config = { path = "../config" }
base = { path = "../base" }
ui = { path = "../ui" }
viewer = { path = "../viewer" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
