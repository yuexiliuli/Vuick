[package]
name = "pdf"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "vuick PDF 阅读器视图 crate（瓦片虚拟化 + 交互/渲染；栅格化核心在 pdf_core）"

[dependencies]
# pdf 拆成 pdf_core（栅格化核心）+ pdf（视图层门面）：本 crate 保留包名并全量重导出 pdf_core。
pdf_core = { path = "../pdf_core" }
gpui = { workspace = true }
pdfium-render = { workspace = true }
kimg = { workspace = true }
anyhow = { workspace = true }
zstd = { workspace = true }
config = { path = "../config" }
base = { path = "../base" }
ui = { path = "../ui" }
viewer = { path = "../viewer" }
# 网格工具栏 拆分/提取/合并 的另存为 / 选源文件对话框（wave8；复用 workspace 既有依赖
# 版本与 Cargo.lock 锁定，shell/shell_pdf 同款 0.17，非新增外部包）。
rfd = { workspace = true }

[build-dependencies]
zstd = { workspace = true }

# Windows 实时硬件键探测（Ctrl+滚轮缩放兜底）：gpui 事件/window 修饰键在真机恒 false
# （GetKeyState 线程消息队列态带不出），用 GetAsyncKeyState(VK_CONTROL) 读实时硬件态。
# 版本对齐 Cargo.lock 既有 windows-sys 0.61.2（polling 等传递依赖），避免多版本冲突。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
