[package]
name = "pdf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor PDF 阅读器 crate（pdfium 栅格化 + 瓦片虚拟化）"
build = "build.rs"

[dependencies]
gpui = { workspace = true }
pdfium-render = { workspace = true }
image = { workspace = true }
anyhow = { workspace = true }
zstd = { workspace = true }
config = { path = "../config" }
base = { path = "../base" }
ui = { path = "../ui" }
viewer = { path = "../viewer" }

[build-dependencies]
zstd = { workspace = true }

# Windows 实时硬件键探测（Ctrl+滚轮缩放兜底）：gpui 事件/window 修饰键在真机恒 false
# （GetKeyState 线程消息队列态带不出），用 GetAsyncKeyState(VK_CONTROL) 读实时硬件态。
# 版本对齐 Cargo.lock 既有 windows-sys 0.61.2（polling 等传递依赖），避免多版本冲突。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
