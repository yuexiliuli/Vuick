[package]
name = "viewer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "vuick 查看器共享组件 crate（pan_zoom 缩放/平移 controller + folder 兄弟文件导航）"

[dependencies]
gpui = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
