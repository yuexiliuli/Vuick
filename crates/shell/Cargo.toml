[package]
name = "shell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 应用外壳 crate（EditorApp 主视图 + 自绘滚动条 + 本地键位组合）"

[dependencies]
gpui = { workspace = true }
# app 直接使用的外部依赖（只重分配、不加新）：系统文件对话框 / 大文档分块读盘异步通道 /
# 检索扫描的内存序搜索 / 文本存储类型。
rfd = { workspace = true }
futures = { workspace = true }
memchr = { workspace = true }
ropey = { workspace = true }
# 非 UTF-8 文本（GBK/GB18030/UTF-16 BOM）打开与按原编码保存写回。
encoding_rs = { workspace = true }
# 会话清单 / 配置 JSON 读写（手写 serde_json::Value，不引入 serde derive；workspace 已有依赖）。
serde_json = { workspace = true }
# 迁入本 crate 后 app/scrollbar 内部经 crate-root 短别名消费的全部项目内 crate。
config = { path = "../config" }
base = { path = "../base" }
# 文本打开 / 编码 / 差异 叶子 crate（自 app/encoding + app/open_progress + app/diff 拆出）。
text_open = { path = "../text_open" }
# 系统托盘（Windows）：关闭到托盘 / 托盘恢复 / 托盘退出。非 windows 目标为 no-op。
tray = { path = "../tray" }
# 提取主窗口原生 HWND 交给 tray crate（复用 workspace 已有 raw-window-handle=0.6）。
raw-window-handle = { workspace = true }
syntax = { path = "../syntax" }
ui = { path = "../ui" }
editor = { path = "../editor" }
markdown = { path = "../markdown" }
# WYSIWYG 编辑器：自 markdown 拆分独立的新 crate（shell 直接消费 markdown_wysiwyg::*）。
markdown_wysiwyg = { path = "../markdown_wysiwyg" }
toc = { path = "../toc" }
pdf = { path = "../pdf" }
image_viewer = { path = "../image_viewer" }
# 视频查看器随本 crate 的 `video` feature 开关（`cfg(feature = "video")`）。
video = { path = "../video", optional = true }
epub = { path = "../epub" }
# 会话持久化 / 设置导出 / 最近面板实体 叶子 crate（自 app/session + app/settings_xfer +
# app/recent_panel 拆出；shell 保留编排、经 RecentPanelHost trait 接入面板）。
session_store = { path = "../session_store" }
# 音乐播放器（Phase A 引擎 + Phase B UI 已提交）：shell 集成（整窗音乐模式 /
# 打开音频文件路由 / 状态栏指示）。不静态链 FFmpeg（运行时经 libloading 加载）。
music = { path = "../music" }

[features]
default = ["video"]
# video：与根包同名 feature 一致，开启 video crate 依赖（实际消费 VideoViewer 的层）。
# ui 的 `video` 图标变体不在此转发：video crate 自身声明 `ui{features=["video"]}`
# （见 crates/video/Cargo.toml），一经 `dep:video` 开启即随之启用；显式转发点统一在根包。
# --no-default-features 时本 feature 关闭 → 视频整链关闭、不拉 FFmpeg 依赖。
video = ["dep:video"]

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
# K8 根因：config 作依赖编译不带自身 cfg(test) → 其 load() 在 shell 测试里直读真实
# %APPDATA% 配置。此处 dev 下显式打开 test-mode，让 config_path()/session_dir()/load()/save()
# 全部落在隔离临时目录，杜绝真实配置/会话泄漏进测试（dev-dep 仅测试构建启用，不影响
# `cargo build --bin gpui-editor` 的生产路径）。
config = { path = "../config", features = ["test-mode"] }
