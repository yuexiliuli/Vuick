[package]
name = "editor"
version = "0.1.0"
edition = "2024"
description = "gpui-editor 自研文本/代码编辑器 crate（CodeEditor：buffer/fold/highlight/movement/selection/undo/rope_ext/markdown 装饰）"

[dependencies]
gpui = { workspace = true }
# 文本存储：自研 CodeEditor 直接持有的 ropey 缓冲（同一版本依赖，仅从根包重分配）。
ropey = { workspace = true }
# 编辑器代码高亮：syntect 解析默认语法集（features 对齐：parsing + default-syntaxes + regex-fancy）。
syntect = { workspace = true }
config = { path = "../config" }
base = { path = "../base" }
ime = { path = "../ime" }
# 编辑器视图渲染用 ui 的 theme/scrollbar/shell（第二 UI 组件 crate，依赖 {config,base,ime} 不依赖 editor）。
ui = { path = "../ui" }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
