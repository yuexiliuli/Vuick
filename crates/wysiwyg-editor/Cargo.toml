[package]
name = "wysiwyg-editor"
version = "0.1.0"
edition = "2024"
description = "From-scratch multi-line WYSIWYG Markdown editor for GPUI (ported from zorite's gpui-editor crate)."
license = "GPL-3.0-or-later"

[dependencies]
# Shared workspace spec (the repo root pins the rev) so Cargo unifies to one gpui.
gpui = { workspace = true }

# Grapheme-cluster boundaries for cursor movement, so an emoji / combining mark
# moves as a single unit (matches gpui's own input example).
unicode-segmentation = "1"

# Shared markdown-construct recognition (`gpui_markdown::syntax`): alert kinds,
# table styles, heading scales. Rendering stays entirely this crate's own.
gpui-markdown = { path = "../gpui-markdown", default-features = false }

# Bidi index→x mapping. gpui's own `x_for_index` / `index_for_x` assume byte
# index and x rise together, which is false for a right-to-left line — so
# every caret/click lookup in this crate goes through `VisualMap` on RTL rows.
gpui-bidi = { path = "../gpui-bidi" }
