[package]
name = "base"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 叶子基础 crate（EditIntent / 动作类型与输入键位 / warm emoji / util / prof）"

[dependencies]
gpui = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
gpui = { workspace = true, features = ["test-support"] }
