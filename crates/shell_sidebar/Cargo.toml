[package]
name = "shell_sidebar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "vuick 侧边栏域 crate（自 shell 的 app/sidebar 拆出：SidebarChromeState / SidebarView 状态 + chrome 外壳渲染 + toc 目录视图 + FileTreePrompt 输入弹层；纯结构移动，只重分配既有依赖，不新增外部包，经 SidebarHost / FileTreePromptHost 宿主服务面与 shell 解耦）"

[dependencies]
# 侧栏实体 / 事件监听 / 元素渲染 / ScrollHandle / Hsla 等。
gpui = { workspace = true }
# 主题取色与组件：活动栏图标/tooltip、scroll_panel、empty_state、input（含 InputState）、motion。
ui = { path = "../ui" }
# 布局常量：SIDEBAR_ACTIVITY_W / SIDEBAR_WIDTH_MIN / SIDEBAR_WIDTH_MAX。
config = { path = "../config" }
# 宿主模型（AppModel / MdTocScroll / PdfBookmark / MediaReader / SearchScopeTab）与 ScrollHandle；跨 crate 命名经它。
shell_core = { path = "../shell_core" }
# 侧栏搜索的纯扫描层（文件夹级后台递归扫描 + 行级命中收集 + 大小写不敏感查找；自 shell 拆出的叶子 crate）。
shell_scan = { path = "../shell_scan" }
# 文件夹级搜索的后台分块扫描：主线程只收块增量装配（有界 mpsc 通道背压，参考 spawn_progressive_open）。
futures = { workspace = true }
# 目录树折叠/可见性纯函数 + toc_item_frame 单条目录可视件（TOC_ROW_H）。
toc = { path = "../toc" }
# PDF 大纲条目 / PdfViewer 实体（目录 PDF outlines 读取与书签跳页）。
pdf = { path = "../pdf" }
# toc_cache 的目录条目类型（markdown_wysiwyg::TocEntries）。
markdown_wysiwyg = { path = "../markdown_wysiwyg" }
