[package]
name = "shell_pdf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "vuick PDF 域 crate（自 shell 的 app/pdf_bookmarks + app/pdf_bg + app/pdf_menu 拆出：书签持久化 / 背景重着色 / 页操作动作逻辑；纯结构移动只重分配既有依赖，不新增外部包；经 PdfHost 宿主服务面与 shell 解耦，菜单视图/挂载与 win32 取色宿主适配留 shell）"

[dependencies]
# 书签/背景/菜单域逻辑：gpui 实体/窗口/上下文/确认框/通知 key。
gpui = { workspace = true }
# 背景预设枚举（PdfBgPref）与书签存储路径（UserPrefs::config_path，test-mode 隔离）。
config = { path = "../config" }
# 原子写（临时文件 + rename）。
base = { path = "../base" }
# 宿主模型（AppModel / PdfBookmark / MediaReader）。
shell_core = { path = "../shell_core" }
# 通用「路径键 + 进程缓存 + 原子写」JSON 存储层（path_key_json_store：书签/阅读进度
# 共用的持久化骨架；shell_core 已依赖 session_store，本边无新增传递包）。
session_store = { path = "../session_store" }
# PDF 栅格化视图实体（PdfViewer / RecolorParams / is_writeback_busy_error）。
pdf = { path = "../pdf" }
# 共享内容渲染层颜色令牌（`ui::content_colors`：画布预设字节 / 墨迹色）。
ui = { path = "../ui" }
# 书签存储 / 背景偏好 JSON 读写（手写 serde_json::Value，不引入 serde derive）。
serde_json = { workspace = true }
# 「提取页面为 PDF」另存为对话框（原 shell pdf_menu 同款）。
rfd = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（仅测试构建，不新增外部包），
# 供 `#[gpui::test]` 无头驱动 AppModel + PdfViewer 实体（与 pdf crate 同款姿势）。
gpui = { workspace = true, features = ["test-support"] }
# K8 根因同款（对齐 shell/music）：config 作依赖编译不带自身 cfg(test) → 书签持久化
# 走 UserPrefs::config_path() 在测试里会直读/直写真实 %APPDATA% 的 pdf_bookmarks.json。
# 此处 dev 下显式打开 test-mode，让 config_path() 落在 %TEMP%\vuick-test-<pid> 隔离目录
# （dev-dep 仅测试构建启用，不影响生产路径 `cargo build --bin vuick`）。
config = { path = "../config", features = ["test-mode"] }
