[package]
name = "gpui-markdown"
version = "0.1.0"
edition = "2024"
description = "Markdown construct recognition for GPUI (vendored syntax subset used by the WYSIWYG editor)."
license = "GPL-3.0-or-later"

# Vendored into this repo as a dependency-free `syntax`-only crate: the
# WYSIWYG editor consumes `gpui_markdown::syntax` for construct recognition.
# The original reader view (`view` feature) is intentionally not ported.
[features]
default = []
