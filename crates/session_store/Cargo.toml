[package]
name = "session_store"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "vuick 会话持久化存储 / 设置导出序列化 / 「打开最近」面板实体 crate（自 shell 的 app/session + app/settings_xfer + app/recent_panel 拆出的叶子 crate；纯结构移动，只重分配既有依赖，不新增外部包）"

[dependencies]
# 最近面板实体（Render / Focusable / gpui::DismissEvent / Entity/WeakEntity 句柄）。
gpui = { workspace = true }
# 最近面板渲染壳：Acrylic 卡 + 滚动条 + 图标 + 主题（palette/scrollbar/icon/theme/motion）。
ui = { path = "../ui" }
# 会话清单 / 槽位 / 导入写盘经「临时文件 + rename」原子写（base::util::atomic_write）。
base = { path = "../base" }
# 会话清单 / 设置导出包的 JSON 序列化（手写 serde_json::Value，不引入 serde derive）。
serde_json = { workspace = true }

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 叠加 test-support feature（不能用 gpui-test-support 别名，见根 Cargo.toml 注释）。
# recent_panel 行为级回归（mousedown 焦点闪烁）需 `#[gpui::test]` / TestAppContext。
gpui = { workspace = true, features = ["test-support"] }
