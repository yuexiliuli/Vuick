[package]
name = "editor_core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "gpui-editor 自研编辑器的核心模型层（buffer/selection/undo/movement/rope_ext/highlight/fold/markdown/find/goto 纯状态与纯函数；颜色标记单一来源走 ui::theme，见依赖注释）"

[dependencies]
# 文本存储：ropey 直接持有的缓冲（workspace 同版本，仅从根包重分配）；gpui 提供
# SharedString/Hsla/HighlightStyle 等与视图共享的类型。
gpui = { workspace = true }
ropey = { workspace = true }
# 编辑区内查找（Ctrl+F）：匹配用字面文本正则（regex::escape 转义），既有 workspace 依赖。
regex = { workspace = true }
# 编辑器代码高亮：syntect 解析默认语法集（features 对齐：parsing + default-syntaxes + regex-fancy）。
syntect = { workspace = true }
# 高亮单真值：语法集 find_syntax/semantic_name/GitHubTheme 消费 syntax crate。
syntax = { path = "../syntax" }
# 撤销分组意图类型（EditIntent）已下沉 base，`undo::EditIntent` 由本 crate 重导出。
base = { path = "../base" }
# Markdown「所见即所得」滤镜的颜色单一来源 ui::theme（ui 不依赖 editor/editor_core，无环）。
ui = { path = "../ui" }
