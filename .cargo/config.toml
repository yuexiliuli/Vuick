# FFmpeg 运行库与主 exe 彻底解耦（运行时动态加载）——本文件无需任何链接器覆盖。
#
# 架构：解码内核在独立工作区成员 `video-ffmpeg`（cdylib，内部用 ffmpeg-next 静态导入
# FFmpeg 的 7 个 shared dll）。主 exe 的 PE 导入表**不含任何 av*.dll**，只在用户真正打开
# 视频时用 libloading 运行时加载 `video_ffmpeg.dll`；该 cdylib 或其 FFmpeg 依赖缺失时，
# `src/video/decode.rs::available()` 返回 false → 查看器在窗口内报「缺少视频运行库」，
# exe 照常启动、其它功能不受影响。
#
# 曾尝试用 /DELAYLOAD 让 FFmpeg dll 原地延迟加载改动最小，但经最小复现实验证实：
# 无论 MSVC link.exe 还是 LLVM lld-link 都无法把 gyan/BtbN 的 FFmpeg 导入库（GNU libtool
# 风格）转换为 delay 导入（LNK4199 / 静默忽略），故采用上述 cdylib 拆分方案。
#
# 分发：`pwsh scripts/package.ps1` 会一并构建并捆绑 video_ffmpeg.dll + FFmpeg dll（随库可用）；
# 只发 exe 也可以（视频功能缺库时窗口内报错）。
# 无 FFmpeg 环境的源码构建：`cargo build --no-default-features --exclude video-ffmpeg`。
