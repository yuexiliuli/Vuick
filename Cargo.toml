[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
aes-gcm = "0.10"
hex = "0.4"
rfd = "0.17"
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
zip = "2"
roxmltree = "0.21"
# 纯 Rust PDF 栅格化（无原生 DLL），文档可跨线程共享，页级按需渲染。
# 参考 gpui-pdf（zorite crates/gpui-pdf）解析/渲染路径。
hayro = "0.7"
image = "0.25"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[features]
test-support = ["gpui/test-support"]
