[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
edition = "2021"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
aes-gcm = "0.10"
hex = "0.4"
rfd = "0.17"
# 编辑器代码/文本高亮用 gpui-component 官方 tree-sitter 实现
# （crates/ui/src/highlighter + input_highlighter_factory，按需开语言）。
gpui-component = { git = "https://github.com/longbridge/gpui-component",
    features = ["tree-sitter", "tree-sitter-markdown", "tree-sitter-rust", "tree-sitter-toml",
        "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript",
        "tree-sitter-tsx", "tree-sitter-html", "tree-sitter-css", "tree-sitter-c",
        "tree-sitter-cpp", "tree-sitter-go", "tree-sitter-java", "tree-sitter-bash",
        "tree-sitter-yaml", "tree-sitter-sql"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
zip = "2"
roxmltree = "0.21"
# PDF 栅格化用 native pdfium（Edge 同款内核，首次浏览流畅）；
# 页级按需渲染 + 磁盘 PNG 二级缓存/内存预算由 view.rs 承担。
pdfium-render = "0.9.3"
image = "0.25"
[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[features]
test-support = ["gpui/test-support"]

# 编辑器语法高亮与文本编辑是 CPU 密集的处理，debug（未优化）下慢到不可用：
# gpui-component 官方 highlighter 用 tree-sitter 增量解析**全文语法树**，
# 160 万行/6MB 文档未优化时解析+配色可达约 10s。
# 对 tree-sitter 栈与编辑核心单独开 3 级优化（其余依赖保持快速编译），
# 保证开发/调试时高亮与打开大文件即时。
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-language]
opt-level = 3
[profile.dev.package.streaming-iterator]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-json]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-html]
opt-level = 3
[profile.dev.package.tree-sitter-css]
opt-level = 3
[profile.dev.package.tree-sitter-c]
opt-level = 3
[profile.dev.package.tree-sitter-cpp]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-java]
opt-level = 3
[profile.dev.package.tree-sitter-bash]
opt-level = 3
[profile.dev.package.tree-sitter-yaml]
opt-level = 3
[profile.dev.package.tree-sitter-toml-ng]
opt-level = 3
[profile.dev.package.tree-sitter-sequel]
opt-level = 3
[profile.dev.package.tree-sitter-md]
opt-level = 3
# 编辑核心（gpui-component/base 的文本缓冲/显示映射/换行布局 + 高亮）
[profile.dev.package.gpui-component]
opt-level = 3
[profile.dev.package.gpui-base]
opt-level = 3
[profile.dev.package.sum_tree]
opt-level = 3
[profile.dev.package.ropey]
opt-level = 3
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.smallvec]
opt-level = 3

[profile.release]
opt-level = "z"        # 优化目标改为最小体积（而非速度）
lto = true             # 跨 crate 链接时优化，消除重复代码
strip = true           # 剥离符号表和调试信息
panic = "abort"        # 移除 unwind 表
codegen-units = 1      # 单线程编译，最大化优化机会（编译变慢）