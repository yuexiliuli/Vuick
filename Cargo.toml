[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
aes-gcm = "0.10"
hex = "0.4"
rfd = "0.17"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[features]
test-support = ["gpui/test-support"]
