[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
# 2024：随 zorite 移植的 WYSIWYG 编辑器（src/markdown/live）使用 edition-2024 的 let-chain。
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memchr = "2"
# 快速非加密哈希（默认 SipHash 在 debug 下对 3000-9000 条容器重建慢 5-10×）：
# fold_plan 重建的 math_start/math_body/fold_lines/dyn_map 全部换 Fx（无迭代序依赖）。
rustc-hash = "1.1"
# 实时预览编辑（WYSIWYG，src/markdown/live）需要的两个小依赖：
# Unicode 字素簇边界（光标移动）与 UAX#9 bidi（RTL 视觉光标/点击映射）。
unicode-segmentation = "1"
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
# 大文档「分块读盘·渐进装配」的异步通道（生产端非阻塞发送 / 消费端可 await；
# 与 gpui 自身使用的 futures 同版本，已在依赖树内，不新增下载）。
futures = "0.3"
rfd = "0.17"
anyhow = "1.0"
zip = "2"
roxmltree = "0.21"
# ropey：自研编辑器直接持有的文本存储类型（CodeEditor 缓冲区/语法缓存）。
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
# PDF 栅格化用 native pdfium
# 容器无损往返，字节逐像素保真（文本层对齐精度不受影响）。
pdfium-render = "0.9.3"
image = { version = "0.25", features = ["webp"] }
# LaTeX 数学排版（参考 zorite-main 的 ratex-gpui 方案）：parse → layout → render，
# 用 KaTeX 字体（embed-fonts 内嵌、纯 CPU 光栅），把 `$$…$$` / `$…$` 排版成 RenderImage，
# 取代原来的 Unicode 近似（`∫₋∞∞` 等上下标/分式/根号终于按真实排版显示）。
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
# 编辑器代码高亮：syntect 解析默认语法集（features 对齐：parsing + default-syntaxes + regex-fancy）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
libjpeg-turbo-rs = "0.8"
# 视频查看器（src/video/）解码内核：ffmpeg-next 9.0 高层封装，配 gyan FFmpeg 9.0.2
# shared 构建。构建期需 FFMPEG_DIR（头文件/导入库）+ LIBCLANG_PATH（bindgen），
# 开发机一键装填见 scripts/setup-ffmpeg.ps1；无 FFmpeg 环境的源码构建方可用
# `cargo build --no-default-features` 绕过（视频功能关闭）。
ffmpeg-next = { version = "9.0", optional = true }
cpal = "0.18.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[features]
default = ["video"]
test-support = ["gpui/test-support"]
video = ["dep:ffmpeg-next"]


[profile.release]
opt-level = "z"        # 优化目标改为最小体积（而非速度）
lto = true             # 跨 crate 链接时优化，消除重复代码
strip = true           # 剥离符号表和调试信息
panic = "abort"        # 移除 unwind 表
codegen-units = 1      # 单线程编译，最大化优化机会（编译变慢）
