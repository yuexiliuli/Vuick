[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
# 2024：随 zorite 移植的 WYSIWYG 编辑器（src/markdown/live）使用 edition-2024 的 let-chain。
edition = "2024"

[dependencies]
# gpui：钉死 zed 仓库提交（显式 rev，避免 cargo update 漂移；升级需同步改 workspace.dependencies 与 Cargo.lock）。
gpui = { workspace = true }
gpui_platform = { workspace = true }
# P5 拆分终态：本二进制薄壳只需挂 shell（EditorApp + bind_local_keymaps）与
# main.rs 直接引用的共享 crate（ui::root / ui::theme、config::user、syntax::prewarm、
# base::actions 动作类型）；其余全部外部依赖已随各自功能 crate 迁出。
# default-features = false：shell 的 `video` feature 由根 `video` feature 显式转发，
# 否则 `--no-default-features` 仍会经 shell 自带的默认 video feature 拉进 FFmpeg 依赖。
shell = { path = "crates/shell", default-features = false }
ui = { path = "crates/ui" }
config = { path = "crates/config" }
syntax = { path = "crates/syntax" }
base = { path = "crates/base" }
# P4：视频解码内核已随 video crate 独立；作为可选依赖，由根 `video` feature 开关
# （实际视频功能在 shell crate，本依赖仅保留以维持 feature 语义与转发）。
video = { path = "crates/video", optional = true }

[features]
default = ["video"]
test-support = ["gpui/test-support"]
# video：P4 已把视频模块拆为独立 `video` crate。
# 本 feature = 开启该可选依赖、转发给 ui crate（IconName::Play/Pause/… 视频图标变体，
# 见 ui/icon.rs），并转发给 shell crate（实际消费 VideoViewer 的层）。
video = [
    "dep:video",
    "ui/video",
    "shell/video",
]

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 依赖叠加 test-support feature（features 与 workspace 定义相加；
# 不能改用 `gpui-test-support` 别名——同一 crate 对同一包起两个名字会报「multiple times with different names」）。
gpui = { workspace = true, features = ["test-support"] }

[workspace]
resolver = "2"
members = ["video-ffmpeg", "crates/config", "crates/base", "crates/ime", "crates/viewer", "crates/syntax", "crates/ui", "crates/editor", "crates/markdown", "crates/toc", "crates/pdf", "crates/image_viewer", "crates/video", "crates/epub", "crates/shell"]
# 根包 + 视频解码内核成员同为默认成员：`cargo build` / `cargo run` / `cargo test`（不带 -p）
# 默认同时覆盖两者——否则（根包子包工作区）普通 `cargo build` 只构建本包，`video_ffmpeg.dll`
# 不产出（运行/测试/打包都找不到它），迁走的解码回归测试也被漏跑。
# 无 FFmpeg 环境的源码构建仍可用 `cargo build --workspace --no-default-features --exclude video-ffmpeg` 绕过。
default-members = [".", "video-ffmpeg"]

# ---------------------------------------------------------------------------
# workspace 统一依赖：版本与拆 crate 前根 Cargo.toml 逐项完全一致，只重分配不升级。
# 各成员 crate 用 `x.workspace = true` 引用；升级/换版本只在此处改一处。
# ---------------------------------------------------------------------------
[workspace.dependencies]
# gpui：钉死 zed 仓库提交（显式 rev，避免 cargo update 漂移；升级需同步改三处与 Cargo.lock）。
gpui = { git = "https://github.com/zed-industries/zed", rev = "93d745668805029476e6d7fbb19652116fed51de" }
# 测试支持：同一 gpui 包开启 test-support feature 的别名（带测试的 crate 放 dev-dependencies）。
gpui-test-support = { package = "gpui", git = "https://github.com/zed-industries/zed", rev = "93d745668805029476e6d7fbb19652116fed51de", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "93d745668805029476e6d7fbb19652116fed51de", features = ["font-kit"] }
serde_json = "1"
regex = "1"
memchr = "2"
rustc-hash = "1.1"
futures = "0.3"
rfd = "0.17"
anyhow = "1.0"
zip = "2"
roxmltree = "0.21"
# ropey：自研编辑器直接持有的文本存储类型（CodeEditor 缓冲区/语法缓存）。
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
# PDF 栅格化用 native pdfium
pdfium-render = "0.9.3"
image = { version = "0.25", features = ["webp"] }
# LaTeX 数学排版：parse → layout → render（embed-fonts 内嵌 KaTeX 字体）。
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
# 编辑器代码高亮：syntect 解析默认语法集（features 对齐：parsing + default-syntaxes + regex-fancy）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
libjpeg-turbo-rs = "0.8"
libloading = "0.8"
cpal = "0.18.2"

[profile.release]
opt-level = "z"        # 优化目标改为最小体积（而非速度）
lto = true             # 跨 crate 链接时优化，消除重复代码
strip = true           # 剥离符号表和调试信息
panic = "abort"        # 移除 unwind 表
codegen-units = 1      # 单线程编译，最大化优化机会（编译变慢）
