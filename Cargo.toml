[package]
name = "gpui-editor"
version = "0.1.0"
license = "Apache-2.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
# 2024：随 zorite 移植的 WYSIWYG 编辑器（src/markdown/live）使用 edition-2024 的 let-chain。
edition = "2024"

[dependencies]
# gpui：钉死 zed 仓库提交（显式 rev，避免 cargo update 漂移；升级需同步改 workspace.dependencies 与 Cargo.lock）。
gpui = { workspace = true }
gpui_platform = { workspace = true }
# P5 拆分终态：本二进制薄壳只需挂 shell（EditorApp + bind_local_keymaps）与
# main.rs 直接引用的共享 crate（ui::root / ui::theme、config::user、syntax::prewarm、
# base::actions 动作类型）；其余全部外部依赖已随各自功能 crate 迁出。
# default-features = false：shell 的 `video` feature 由根 `video` feature 显式转发，
# 否则 `--no-default-features` 仍会经 shell 自带的默认 video feature 拉进 FFmpeg 依赖。
shell = { path = "crates/shell", default-features = false }
ui = { path = "crates/ui" }
config = { path = "crates/config" }
syntax = { path = "crates/syntax" }
base = { path = "crates/base" }
# P6：系统托盘（Windows 托盘图标 / 关闭到托盘），unsafe Win32 全部收敛在该 crate。
tray = { path = "crates/tray" }
# 音乐播放器核心引擎（Phase A：解码桥 + cpal 输出 + 播放引擎）。不静态链 FFmpeg，
# 运行时经 libloading 复用 media_ffmpeg.dll（缺库不碍 exe 启动）；cpal/libloading 已在 workspace。
music = { path = "crates/music" }
# P4：视频解码内核（FFmpeg 经 libloading 运行时加载）已随 video crate 独立；
# 作为可选依赖由根 `video` feature 经 `dep:video` 开启——根包不直接消费 video crate，
# 该可选依赖是整链的总开关（--no-default-features 即完全不拉 FFmpeg 相关代码）。
video = { path = "crates/video", optional = true }

[features]
default = ["video"]
test-support = ["gpui/test-support"]
# video：开启视频整链（单一转发层）。`dep:video` = 编译 video 解码内核 crate；
# `ui/video` = ui 视频图标变体（IconName::Play/Pause/…，见 ui/icon.rs）——根是唯一显式转发点，
# 另经 video crate 自身 `ui{features=["video"]}` 随 `dep:video` 启用；`shell/video` = shell 消费层
# （shell 内 `video = ["dep:video"]`，不再向 ui 二次转发）。--no-default-features 时整链关闭。
video = [
    "dep:video",
    "ui/video",
    "shell/video",
]

[dev-dependencies]
# zed 同款：dev 下给同一 gpui 依赖叠加 test-support feature（features 与 workspace 定义相加；
# 不能改用 `gpui-test-support` 别名——同一 crate 对同一包起两个名字会报「multiple times with different names」）。
gpui = { workspace = true, features = ["test-support"] }

[workspace]
resolver = "2"
members = ["crates/media_ffmpeg", "crates/media_io", "crates/config", "crates/base", "crates/ime", "crates/viewer", "crates/syntax", "crates/ui", "crates/editor", "crates/editor_core", "crates/text_open", "crates/markdown", "crates/markdown_wysiwyg", "crates/markdown_wysiwyg_engine", "crates/markdown_wysiwyg_mermaid", "crates/markdown_wysiwyg_math", "crates/toc", "crates/pdf", "crates/pdf_core", "crates/image_viewer", "crates/video", "crates/epub",     "crates/shell", "crates/shell_core", "crates/shell_sidebar", "crates/shell_pdf", "crates/shell_media", "crates/shell_preview", "crates/shell_tabs", "crates/tray", "crates/music", "crates/session_store", "crates/shell_commands", "crates/shell_scan", "crates/shell_widgets", "crates/imgbench", "crates/kimg", "crates/kimg_core", "crates/kimg_png", "crates/kimg_gif", "crates/kimg_webp", "crates/kimg_jpeg", "crates/kimg_tiff", "crates/kimg_bmp",     "crates/kimg_ico", "crates/kimg_pnm", "crates/kimg_heif",
    "vendor/zed/crates/gpui", "vendor/zed/crates/gpui_windows", "vendor/zed/crates/gpui_platform", "vendor/zed/crates/gpui_macros", "vendor/zed/crates/gpui_shared_string", "vendor/zed/crates/gpui_util", "vendor/zed/crates/collections", "vendor/zed/crates/scheduler", "vendor/zed/crates/sum_tree", "vendor/zed/crates/refineable", "vendor/zed/crates/refineable/derive_refineable", "vendor/zed/crates/http_client"]
# 根包 + 视频解码内核成员同为默认成员：`cargo build` / `cargo run` / `cargo test`（不带 -p）
# 默认同时覆盖两者——否则（根包子包工作区）普通 `cargo build` 只构建本包，`media_ffmpeg.dll`
# 不产出（运行/测试/打包都找不到它），迁走的解码回归测试也被漏跑。
# 无 FFmpeg 环境的源码构建仍可用 `cargo build --workspace --no-default-features --exclude media_ffmpeg` 绕过。
default-members = [".", "crates/media_ffmpeg"]

# ---------------------------------------------------------------------------
# workspace 统一依赖：版本与拆 crate 前根 Cargo.toml 逐项完全一致，只重分配不升级。
# 各成员 crate 用 `x.workspace = true` 引用；升级/换版本只在此处改一处。
# ---------------------------------------------------------------------------

  [workspace.package]
  publish = false
  edition = "2024"
  license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = "allow"

[workspace.dependencies]
# gpui：P6 已 vendor 到本仓 vendor/zed（zed rev 93d7456 的 Windows 子集闭包，Apache-2.0）。
# 不再用 git 依赖——GPU 直通（YUV 着色器/D3D11 设备暴露/外部纹理）需改 gpui/gpui_windows，本仓内 fork 可随意改。
gpui = { path = "vendor/zed/crates/gpui" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"] }
serde_json = "1"
regex = "1"
memchr = "2"
rustc-hash = "2"
futures = "0.3"
rfd = "0.17"
anyhow = "1.0"
# 文本编码解码（GBK/GB18030/UTF-16 等）：打开非 UTF-8 文本与按原编码保存写回。
# 许可 Apache-2.0/MIT 双许可，用户已批准（属「不加依赖」纪律的一次性例外）。
encoding_rs = "0.8"
zip = "2"
roxmltree = "0.21"
# ropey：自研编辑器直接持有的文本存储类型（CodeEditor 缓冲区/语法缓存）。
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
# PDF 栅格化用 native pdfium。default off：取消 default `image_latest`（= image_025，
# 唯一把 crates.io image 拉进 lock 的 feature）；本仓只用核心栅格 API（PdfDocument/
# PdfBitmap），保留 pdfium_latest + thread_safe（worker 线程架构的 Send+Sync 不变式）。
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# pdfium dll 体积剪枝：build.rs 用 zstd level 19 压缩内嵌载荷（6.9MiB→2.9MiB），运行期一次性解压。
# 许可 BSD-3-Clause/MIT（zstd），构建期编译自带 C 源（cc + MSVC，与 ffmpeg-sys-next 同工具链）。
zstd = "0.13"
# image → kimg 收尾（P4）：依赖键名换为 `kimg`，全仓源码已改 `use kimg::...`。
kimg = { path = "crates/kimg" }
# kimg 拆分（2026-11）：共享核心 + 每格式独立 crate。消费方仍只依赖 `kimg` 门面（全量重导出），
# 各格式 crate 由 kimg 门面依赖，仅 imgbench 经门面转发 stage_profile 探针 feature。
kimg_core = { path = "crates/kimg_core" }
kimg_png = { path = "crates/kimg_png" }
kimg_gif = { path = "crates/kimg_gif" }
kimg_webp = { path = "crates/kimg_webp" }
kimg_jpeg = { path = "crates/kimg_jpeg" }
kimg_tiff = { path = "crates/kimg_tiff" }
kimg_bmp = { path = "crates/kimg_bmp" }
kimg_ico = { path = "crates/kimg_ico" }
kimg_pnm = { path = "crates/kimg_pnm" }
kimg_heif = { path = "crates/kimg_heif" }
# editor 拆分（2026-11）：核心模型层独立 crate（editor = 视图层门面，全量重导出 editor_core）。
editor_core = { path = "crates/editor_core" }
# text_open 拆分（2026-11）：文本打开/编码/差异核心独立 crate（自 shell 的
# app/encoding + app/open_progress + app/diff 拆出；纯结构移动，只重分配既有依赖，不新增外部包）。
text_open = { path = "crates/text_open" }
# pdf 拆分（2026-11）：栅格化核心独立 crate（pdf = 视图层门面，全量重导出 pdf_core）。
pdf_core = { path = "crates/pdf_core" }
# markdown_wysiwyg_mermaid 拆分（2026-11）：mermaid 渲染子系统独立 crate（自 markdown_wysiwyg 的
# wysiwyg/mermaid 拆分；纯结构移动，只重分配既有依赖，不新增外部包）。
markdown_wysiwyg_mermaid = { path = "crates/markdown_wysiwyg_mermaid" }
# markdown_wysiwyg_engine 拆分（2026-11）：元素引擎纯类型核心独立 crate（自 markdown_wysiwyg
# 的 wysiwyg/theme + wysiwyg/element 纯类型/geom 拆分；纯结构移动，只重分配既有依赖，
# 不新增外部包）。
markdown_wysiwyg_engine = { path = "crates/markdown_wysiwyg_engine" }
# markdown_wysiwyg_math 拆分（2026-11）：数学渲染子系统独立 crate（自 markdown_wysiwyg 的
# wysiwyg/math + math_typeset + types/geom 随迁项拆分；纯结构移动，只重分配既有依赖，
# 不新增外部包）。
markdown_wysiwyg_math = { path = "crates/markdown_wysiwyg_math" }
# session_store 拆分（2026-11）：会话持久化存储 / 设置导出序列化 / 最近面板实体
# 独立 crate（自 shell 的 app/session + app/settings_xfer + app/recent_panel 拆出；
# 纯结构移动，只重分配既有依赖，不新增外部包）。
session_store = { path = "crates/session_store" }
# shell 拆分（2026-11）：公共命令表（纯命令表）与侧边栏跨文件搜索纯扫描层
# 各自独立叶子 crate（自 shell 的 commands.rs / app/sidebar/mod.rs 纯扫描部分拆出；
# 纯结构移动，只重分配既有依赖，不新增外部包）。
shell_commands = { path = "crates/shell_commands" }
shell_scan = { path = "crates/shell_scan" }
# shell_widgets 拆分（L0，2026-11-11）：纯 UI 组件叶子 crate（自 shell 的 scrollbar.rs +
# app/tabs.rs 的 TabBoundsRecorder 拆出；纯结构移动，只重分配既有依赖，不新增外部包，
# 零 EditorApp 依赖，供 shell 各域承接复用）。
shell_widgets = { path = "crates/shell_widgets" }
# shell_core 拆分（SC-1，2026-11）：外壳宿主纯模型类型（自 shell 的 app/mod.rs
# 的 EditorTab/DetachedTab/MediaReader/MdWyInstall/拖拽/标题栏等拆出；纯结构移动，
# 只重分配既有依赖，不新增外部包；宿主编排留在 shell）。
shell_core = { path = "crates/shell_core" }
# shell_sidebar 拆分（2026-11）：侧边栏域 crate（自 shell 的 app/sidebar 拆出：
# SidebarChromeState/SidebarView 状态 + chrome 外壳渲染 + toc 目录视图 + FileTreePrompt
# 输入弹层；纯结构移动，只重分配既有依赖，不新增外部包；经 SidebarHost /
# FileTreePromptHost 宿主服务面与 shell 解耦，click 状态机等仍由 shell 宿主承接）。
shell_sidebar = { path = "crates/shell_sidebar" }
# shell_pdf 拆分（2026-11-11）：PDF 域 crate（自 shell 的 app/pdf_bookmarks + app/pdf_bg +
# app/pdf_menu 拆出：书签持久化 / 背景重着色 / 页操作动作逻辑；纯结构移动只重分配既有依赖，
# 不新增外部包；经 PdfHost 宿主服务面与 shell 解耦，菜单视图/挂载与 win32 取色宿主适配留 shell）。
shell_pdf = { path = "crates/shell_pdf" }
# shell_preview 拆分（2026-11-11）：预览域 crate（自 shell 的 app/preview + app/panes 的
# 预览渲染半拆出：md_wy 统一 WyEditor 安装/swap/切换/活区 + 编辑⇄预览滚动同步 + 路径分类 +
# 预览渲染元素；纯结构移动只重分配既有依赖，不新增外部包；经 PreviewHost 宿主服务面与
# shell 解耦，编辑事件订阅/feed 宿主薄适配留 shell）。
shell_preview = { path = "crates/shell_preview" }
# shell_media 拆分（2026-11-11）：媒体/音乐域 crate（自 shell 的 app/media + app/media_window +
# app/music_player 拆出：查看器元数据同步 / 锁定菜单项构建 / 媒体窗口打开决策与路由决议 /
# 音乐模式判定；纯结构移动只重分配既有依赖，不新增外部包；经 MediaHost 宿主服务面与 shell
# 解耦，菜单挂载与窗口/宿主编排留 shell）。
shell_media = { path = "crates/shell_media" }
# shell_tabs 拆分（2026-11-11）：选项卡栏域 crate（自 shell 的 app/tabs 拆出：TabBar 实体
# 渲染 + 选项卡右键菜单项构建 + TabsHost 宿主服务面；纯结构移动只重分配既有依赖，不新增
# 外部包；经 TabsHost 宿主服务面与 shell 解耦，tab_drag 相关入口留 shell 经宿主原路径）。
shell_tabs = { path = "crates/shell_tabs" }
# LaTeX 数学排版：parse → layout → render（embed-fonts 内嵌 KaTeX 字体）。
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
# 编辑器代码高亮：syntect 解析默认语法集（features 对齐：parsing + default-syntaxes + regex-fancy）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
libloading = "0.8"
cpal = "0.18.2"

collections = { path = "vendor/zed/crates/collections", version = "0.1.0" }
derive_refineable = { path = "vendor/zed/crates/refineable/derive_refineable" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_shared_string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui_util = { path = "vendor/zed/crates/gpui_util" }
gpui_windows = { path = "vendor/zed/crates/gpui_windows", default-features = false }
http_client = { path = "vendor/zed/crates/http_client" }
refineable = { path = "vendor/zed/crates/refineable" }
scheduler = { path = "vendor/zed/crates/scheduler" }
sum_tree = { path = "vendor/zed/crates/sum_tree" }
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_windows = "0.34"
async-channel = { version = "2.5", default-features = false }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-task = "4.7"
backtrace = "0.3"
bitflags = "2.6.0"
bytes = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dunce = "1.0"
etagere = "0.2"
flume = { version = "0.12", default-features = false, features = ["async"] }
futures-concurrency = "7.7.1"
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
parking_lot = "0.12.1"
postage = { version = "0.5", default-features = false }
proc-macro2 = "1.0.93"
profiling = "1"
pollster = "0.4.0"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
quote = "1.0.9"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
rayon = "1.8"
resvg = { version = "0.46.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
] }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
taffy = { version = "=0.13.0", default-features = false }
tempfile = "3.20.0"
thiserror = "2.0.12"
tracing = "0.1.40"
tracing-subscriber = "0.3"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
uuid = { version = "1.1", features = ["serde"] }
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = ["es_modules"] }
wasm-bindgen = "0.2.120"
web-sys = "0.3"
web-time = "1.1.0"
which = "8"
windows-core = "0.62"
windows-registry = "0.6.0"

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
[profile.release]
opt-level = 3           # 优化目标改为速度（图像解码/解压热路径带宽优先）
lto = true             # 跨 crate 链接时优化，消除重复代码
strip = true           # 剥离符号表和调试信息
panic = "abort"        # 移除 unwind 表
codegen-units = 1      # 单线程编译，最大化优化机会（编译变慢）

# ---------------------------------------------------------------------------
# 编译提速（2026-11，Cargo Book 官方 build-performance 推荐）：
# - dev 默认只生成「行表」调试信息（可用 panic 回溯到行号，省去全量 debuginfo 的
#   大幅编译/链接/PDB 成本）；依赖一律零调试信息。需要完整调试（本地变量/断点探值）时
#   用 `cargo build --profile debugging` / `cargo test --profile debugging` 显式选用。
# - bench 不再吃 release 的 `lto=true+codegen-units=1`（cargo bench 默认继承 release，
#   曾有 20-30 分钟级构建）：改 thin-LTO + 16 codegen-units，运行期差距可忽略。
# - 注意：本条改变 dev 产物形态，首次生效会触发一次全量重编（target 目录级重建）。
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = 0
