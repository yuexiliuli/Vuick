[package]
name = "gpui-editor"
version = "0.1.0"
description = "基于 GPUI 的文本 / 代码 / Markdown 编辑器"
# 2024：随 zorite 移植的 WYSIWYG 编辑器（src/markdown/live）使用 edition-2024 的 let-chain。
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memchr = "2"
# 实时预览编辑（WYSIWYG，src/markdown/live）需要的两个小依赖：
# Unicode 字素簇边界（光标移动）与 UAX#9 bidi（RTL 视觉光标/点击映射）。
unicode-segmentation = "1"
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
# 大文档「分块读盘·渐进装配」的异步通道（生产端非阻塞发送 / 消费端可 await；
# 与 gpui 自身使用的 futures 同版本，已在依赖树内，不新增下载）。
futures = "0.3"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
aes-gcm = "0.10"
hex = "0.4"
rfd = "0.17"
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
zip = "2"
roxmltree = "0.21"
# 与 gpui-component 同版本同 feature 的 ropey：自研编辑器直接持有的文本存储类型。
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
# PDF 栅格化用 native pdfium（Edge 同款内核，首次浏览流畅）；
# 页级按需渲染 + 磁盘 WebP-Lossless 二级缓存/内存预算由 view.rs 承担。
# webp feature = 纯 Rust 的 image-webp（VP8L 无损），磁盘缓存的 BGRA 以 Rgba8
# 容器无损往返，字节逐像素保真（文本层对齐精度不受影响）。
pdfium-render = "0.9.3"
image = { version = "0.25", features = ["webp"] }
# 编辑器代码高亮：syntect 解析默认语法集（与 gpui-component 工作区同版本同特性，
# 复用其缓存产物；features 对齐根 Cargo.toml：parsing + default-syntaxes + regex-fancy）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# 实时预览编辑（WYSIWYG）：已并入 `src/markdown/live`（不再有独立包）。

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }

[features]
test-support = ["gpui/test-support"]

# 编辑器语法高亮与文本编辑是 CPU 密集的正则/文本处理，debug（未优化）下慢到不可用
# （syntect 解析 16 万行要十余秒、编辑器显示映射/换行布局 6MB 文档 10s+）。
# 对它们单独开 3 级优化（其余依赖保持快速编译），保证开发/调试时高亮与打开大文件即时。
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.bitflags]
opt-level = 3
[profile.dev.package.fnv]
opt-level = 3
# 编辑器核心（gpui-component/base 的文本缓冲/显示映射/换行布局 + 语法高亮窗口解析）
[profile.dev.package.gpui-base]
opt-level = 3
[profile.dev.package.gpui-component]
opt-level = 3
[profile.dev.package.sum_tree]
opt-level = 3
[profile.dev.package.ropey]
opt-level = 3
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.smallvec]
opt-level = 3

[profile.release]
opt-level = "z"        # 优化目标改为最小体积（而非速度）
lto = true             # 跨 crate 链接时优化，消除重复代码
strip = true           # 剥离符号表和调试信息
panic = "abort"        # 移除 unwind 表
codegen-units = 1      # 单线程编译，最大化优化机会（编译变慢）