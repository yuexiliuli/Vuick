[package]
name = "http_client"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[features]
test-support = ["dep:log"]
github-download = [
    "dep:async-compression",
    "dep:async-fs",
    "dep:async-tar",
    "dep:sha2",
    "dep:tempfile",
]

[lib]
path = "src/http_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
log = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
log.workspace = true
async-compression = { workspace = true, optional = true }
async-fs = { workspace = true, optional = true }
async-tar = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[lints]
workspace = true
