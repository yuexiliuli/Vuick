[package]
name = "ztracing"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
doctest = false

[features]
tracing-tracy = ["dep:tracing-tracy", "dep:tracing-subscriber"]
tracy = ["tracing-tracy", "tracy-client"]
web = [
    "dep:async-channel",
    "dep:js-sys",
    "dep:tracing-subscriber",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

[dependencies]
tracing.workspace = true

tracing-subscriber = { workspace = true, optional = true }

ztracing_macro.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-tracy = { version = "0.11", optional = true, features = ["ondemand"] }
tracy-client = { version = "0.18", optional = true, features = ["ondemand"] }

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = { workspace = true, features = ["std"], optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console", "Performance"], optional = true }

[lints]
workspace = true
