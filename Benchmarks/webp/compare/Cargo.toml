[package]
name = "kimg_webp_vs_dll"
version = "0.1.0"
edition = "2024"
publish = false

# 独立 workspace 根：探针位于仓库工作区目录树内（Benchmarks/webp/compare），声明自身为 workspace 根，
# 避免 cargo 把根仓库 workspace 误认为本包所属（"current package believes it's in a workspace
# when it's not" 会拒绝构建）；默认 target 即本目录下 target/（不设 target-dir，独立于根仓库）。

[workspace]

[dependencies]
kimg = { path = "../../../crates/kimg" }

# 速度向可比口径（对照 libwebp 的 -O2；仓库根 workspace release 为 opt-level=3+lto=true，独立探针按原稿 opt-level=3）。
[profile.release]
opt-level = 3
