name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 工具链 pin：仓库根 rust-toolchain.toml（channel = "1.96.0"）是权威来源，
      # dtolnay action 显式装同一版本（不能用 @stable 跟随最新：clippy 组件会装到
      # stable，而 cargo 经 rustup 切到 pin 版本时组件缺失）。升级工具链两处同改。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      # 已知风险：gpui 视觉测试依赖本机字体/像素环境，headless runner 上个别
      # 字体/像素断言可能失败——此类用例可按项目备注补 #[ignore]（future-work T0）。
      # 排除 media-ffmpeg：CI runner 无 FFmpeg 环境（ffmpeg-sys-next 的 bindgen/链接
      # 会构建失败），本 job 只测主包逻辑。需覆盖视频成员时先跑
      # scripts/setup-ffmpeg.ps1 装好 FFMPEG_DIR/LIBCLANG_PATH/运行 dll 再移除 --exclude。
      - name: cargo test
        run: cargo test --all-features --exclude media-ffmpeg

  clippy:
    name: clippy (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 同 test job：显式装 rust-toolchain.toml pin 的 1.96.0，并安装 clippy 组件。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # clippy 全目标全 feature 告警已清零（评审 P2 收尾）——硬门禁：任何新告警直接红。
      # 排除 media-ffmpeg 理由同 test job（无 FFmpeg 环境构建失败；要覆盖需先跑
      # scripts/setup-ffmpeg.ps1 再移除 --exclude）。
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --exclude media-ffmpeg -- -D warnings
